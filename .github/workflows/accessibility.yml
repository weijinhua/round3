name: Accessibility Checks

on:
  pull_request:
    paths:
      - 'packages/design-system/**'

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build tokens
        run: pnpm --filter @charts-gen/design-system run build:tokens
      - name: Run accessibility script (placeholder)
        run: node packages/design-system/scripts/run-axe.js

